          "@type": "Question",
          "name": "¿Qué hago si un familiar fue detenido?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contacte a un abogado penalista de inmediato. El detenido tiene derecho a no declarar sin abogado presente. Nuestro estudio atiende urgencias las 24 horas: nos presentamos en la comisaría, gestionamos la excarcelación y asistimos en la declaración ante el fiscal. Llame al 11 3820-7360."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto tiempo tengo para reclamar después de un accidente de tránsito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En Argentina, el plazo de prescripción para reclamar daños por accidente de tránsito es de 3 años desde la fecha del siniestro (art. 2561 del Código Civil y Comercial). Sin embargo, es recomendable iniciar el reclamo lo antes posible para preservar la prueba y obtener una indemnización justa."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo sé si fui víctima de mala praxis médica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Existe mala praxis cuando un profesional de la salud no actuó conforme a las normas médicas aceptadas y esto causó un daño al paciente. Los indicadores incluyen: diagnóstico erróneo, tratamiento inadecuado, errores quirúrgicos, infecciones intrahospitalarias evitables o alta prematura. Consulte con un abogado especializado que evaluará su historia clínica."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué puedo reclamar en una demanda de daños y perjuicios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puede reclamar: daño patrimonial (gastos médicos, reparaciones, lucro cesante), daño moral (sufrimiento y angustia), incapacidad sobreviniente (si quedó con secuelas), daño psicológico, daño estético y pérdida de chance. Un abogado especializado evaluará todos los rubros aplicables a su caso para obtener la indemnización máxima."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cobra un abogado penalista en Buenos Aires?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Los honorarios varían según la complejidad del caso, la etapa procesal y el tipo de delito. En nuestro estudio la primera consulta es sin cargo: evaluamos su situación y le explicamos los costos antes de avanzar, sin compromiso. Puede consultarnos por WhatsApp al 11 3820-7360."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué diferencia hay entre la justicia ordinaria y la federal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La justicia ordinaria (provincial) atiende la mayoría de los delitos comunes: robos, hurtos, homicidios, estafas. La justicia federal interviene en delitos que afectan intereses nacionales: narcotráfico, contrabando, lavado de dinero, trata de personas y delitos cometidos por funcionarios federales. Nuestro estudio actúa en ambos fueros."
          }
